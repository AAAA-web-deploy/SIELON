<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Visitors — $SIELON</title>
  <link rel="icon" type="image/png" href="../assets/logo-64.png">
  <link rel="stylesheet" href="dashboard.css?v=track-v2">
</head>
<body>
  <main class="dash">
    <header class="dash-top">
      <p class="dash-mark">$SIELON</p>
      <h1>Visitors</h1>
      <button class="dash-out" type="button" data-logout hidden>Sign out</button>
    </header>
    <form class="dash-login" data-login>
      <label for="dash-password">Password</label>
      <input id="dash-password" type="password" name="password" autocomplete="current-password" required>
      <button type="submit">Open</button>
      <p class="dash-note" data-login-note role="status"></p>
    </form>
    <section class="dash-board" data-board hidden>
      <div class="dash-filters">
        <button type="button" data-range="today" class="is-on">Today</button>
        <button type="button" data-range="24h">24 hours</button>
        <button type="button" data-range="7d">7 days</button>
      </div>
      <div class="dash-stats" data-stats></div>
      <p class="dash-note" data-board-note role="status"></p>
      <div class="dash-table-wrap">
        <table>
          <thead>
            <tr><th>Seen</th><th>Page</th><th>Place</th><th>Device</th><th>From</th></tr>
          </thead>
          <tbody data-visits></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="dashboard.js?v=track-v1"></script>
</body>
</html>
